name: Update Gold Watch

on:
  schedule:
    - cron: "17 */6 * * *"   # four times a day; GitHub may start it a few minutes late
  workflow_dispatch:          # lets you press "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: fetch fresh data and package the site.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update.py

      - name: Save data.json back to the repository
        run: |
          git config user.name "gold-watch-bot"
          git config user.email "gold-watch-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Refresh data"
          git pull --rebase origin main
          git push

      - name: Collect the site files
        run: |
          mkdir -p _site
          cp index.html data.json _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Job 2: publish. It starts only after job 1 has finished, so the upload is ready.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
